# Mood Games — mood-app.online
#
# Хаб игр и игры на путях: mood-app.online/blockpop и т.д.
# Сертификат: /etc/letsencrypt/live/mood-app.online (certbot --nginx).

server {
    listen 80;
    listen [::]:80;
    server_name mood-app.online www.mood-app.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name mood-app.online www.mood-app.online;

    ssl_certificate /etc/letsencrypt/live/mood-app.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mood-app.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/mood-games;
    index index.html;

    # ── Хаб игр ──────────────────────────────────────────────────────────────
    location = / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # ── Block Pop ────────────────────────────────────────────────────────────
    location = /blockpop {
        return 301 /blockpop/;
    }

    # Старое имя на новом домене — только редирект.
    location = /block-blast {
        return 301 /blockpop/;
    }

    location ^~ /block-blast/ {
        return 301 /blockpop/;
    }

    # Хешированные ассеты Vite можно кэшировать надолго.
    location ^~ /blockpop/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /blockpop/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Игра — отдельный origin. Yandex SDK и рекламные iframe разрешены
        # только здесь; CSP самого Mood это не затрагивает.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://yandex.ru https://*.yandex.ru https://yastatic.net https://*.yastatic.net https://sdk.games.s3.yandex.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://yandex.ru https://*.yandex.ru https://yastatic.net https://*.yastatic.net https://sdk.games.s3.yandex.net; frame-src https://yandex.ru https://*.yandex.ru https://yandex.com https://*.yandex.com; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;

        try_files $uri $uri/ =404;
    }

    # Всё остальное — статика из /var/www/mood-games.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
